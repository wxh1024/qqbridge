pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 显式指定根项目名，保证产物 jar 恒为中文名「QQ聊天桥-<version>.jar」。
// 不能靠目录名：工程可能被检出/移动到任意目录（如会话目录 2026-10-21-16-04-55）。
// \uXXXX 转义让本文件保持纯 ASCII，GBK 平台也不会乱码。
rootProject.name = "QQ\u804A\u5929\u6865"
