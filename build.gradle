plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral() // 仅用于拉取单元测试的 JUnit，运行时零第三方依赖不变
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 男中音（Baritone）—— 只编译期用 baritone.api（官方 API 未混淆），不打包进产物。
	// 运行时由玩家自行把 Baritone 放进 mods/；未装时拉珍珠寻路能力自动禁用（FabricLoader.isModLoaded 守门）。
	// 该 jar 在 libs/ 入库，保证 CI 也能编译。
	modCompileOnly files("libs/baritone-1.21.11-2026.jar")

	// 单元测试（纯 Java 单测，覆盖格式化/协议编解码/指令解析/错误码映射）
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// 源码含中文字符串/注释，必须显式 UTF-8，否则 GBK 平台编译乱码或失败
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
