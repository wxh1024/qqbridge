name: 构建

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v5

      # Loom 1.18+ 要求 Gradle 运行在 JVM 25 上；mod 产物仍编译为 Java 21
      # （build.gradle 的 options.release = 21），玩家用 Java 21 即可运行。
      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 构建
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QQ聊天桥
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 90
